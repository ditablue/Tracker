<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>習慣化ボディトラッカー</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  body {
    background-color: #0f0f11;
    color: #f3f4f6;
    padding: 12px;
    display: flex;
    justify-content: center;
  }
  .app-container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background-color: #18181b;
    border: 1px solid #27272a;
    border-radius: 12px;
    padding: 14px;
  }
  .header-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-title {
    font-size: 1.1rem;
    font-weight: bold;
    color: #ffffff;
  }
  .progress-badge {
    background-color: #27272a;
    color: #22c55e;
    padding: 4px 10px;
    border-radius: 16px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .week-selector-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .select-style {
    background-color: #27272a;
    color: #f3f4f6;
    border: 1px solid #3f3f46;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    width: 100%;
    outline: none;
  }
  .section-title {
    font-size: 0.95rem;
    font-weight: bold;
    color: #a1a1aa;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .task-card {
    background-color: #18181b;
    border: 1px solid #27272a;
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .task-header {
    padding: 12px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .task-checkbox {
    width: 22px;
    height: 22px;
    margin-top: 2px;
    accent-color: #22c55e;
    cursor: pointer;
  }
  .task-info {
    flex: 1;
  }
  .task-title-text {
    font-size: 0.95rem;
    font-weight: 600;
    color: #f3f4f6;
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .task-meta-line {
    font-size: 0.8rem;
    line-height: 1.4;
    margin-bottom: 2px;
  }
  .meta-trigger {
    color: #38bdf8;
  }
  .meta-effect {
    color: #4ade80;
  }
  .guide-toggle {
    background: none;
    border: none;
    color: #71717a;
    font-size: 0.8rem;
    cursor: pointer;
    padding: 8px 12px;
    width: 100%;
    text-align: left;
    border-top: 1px solid #27272a;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .guide-content {
    display: none;
    padding: 12px;
    background-color: #0f0f11;
    border-top: 1px solid #27272a;
    font-size: 0.82rem;
    color: #d4d4d8;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .guide-content.open {
    display: block;
  }
  .custom-task-input {
    width: 100%;
    background-color: #27272a;
    border: 1px solid #3f3f46;
    border-radius: 6px;
    padding: 8px;
    color: #f3f4f6;
    font-size: 0.85rem;
    margin-bottom: 6px;
  }
</style>
</head>
<body>

<div class="app-container">
  <!-- ヘッダー -->
  <div class="card header-card">
    <div class="header-title">習慣化ボディトラッカー</div>
    <div class="progress-badge" id="progressBadge">進捗: 0%</div>
  </div>

  <!-- 週選択 -->
  <div class="card week-selector-card">
    <select id="weekSelect" class="select-style" onchange="renderTasks()">
      <!-- JSで14週分生成 -->
    </select>
  </div>

  <!-- タスク一覧エリア -->
  <div>
    <div class="section-title">
      <span>今週の習慣タスク (3/3)</span>
    </div>
    <div id="taskList"></div>
  </div>
</div>

// 初期化＆イベント設定
document.addEventListener('DOMContentLoaded', () => {
  initWeekSelect();
  renderTasks();
});

// 週選択肢の生成
function initWeekSelect() {
  const weekSelect = document.getElementById('weekSelect');
  weekSelect.innerHTML = '';
  for (let i = 1; i <= 14; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `第 ${i} 週プログラム`;
    weekSelect.appendChild(opt);
  }
}

// タスクの描画＆ローカルストレージからの読み込み
function renderTasks() {
  const currentWeek = document.getElementById('weekSelect').value;
  const taskList = document.getElementById('taskList');
  taskList.innerHTML = '';

  const tasks = roadmapData[currentWeek] || [];

  tasks.forEach((task, index) => {
    const taskId = `w${currentWeek}_t${index}`;
    // ローカルストレージから保存されたデータを読み込む
    const isChecked = localStorage.getItem(`cb_${taskId}`) === 'true';
    const savedCustomTitle = localStorage.getItem(`title_${taskId}`) || task.title;
    const savedCustomTrigger = localStorage.getItem(`trigger_${taskId}`) || task.trigger;
    const savedCustomEffect = localStorage.getItem(`effect_${taskId}`) || task.effect;

    const taskCard = document.createElement('div');
    taskCard.className = 'task-card';

    taskCard.innerHTML = `
      <div class="task-header">
        <input type="checkbox" id="${taskId}" class="task-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleTask('${taskId}')">
        <div class="task-info">
          <input type="text" class="custom-task-input" value="${escapeHtml(savedCustomTitle)}" onchange="updateTaskText('${taskId}', 'title', this.value)" placeholder="タスク名">
          <div class="task-meta-line meta-trigger">⚡ <b>きっかける:</b> <input type="text" class="custom-task-input" style="display:inline; width:70%; margin:0;" value="${escapeHtml(savedCustomTrigger)}" onchange="updateTaskText('${taskId}', 'trigger', this.value)" placeholder="きっかけ"></div>
          <div class="task-meta-line meta-effect">✨ <b>効果:</b> <input type="text" class="custom-task-input" style="display:inline; width:70%; margin:0;" value="${escapeHtml(savedCustomEffect)}" onchange="updateTaskText('${taskId}', 'effect', this.value)" placeholder="効果"></div>
        </div>
      </div>
      <button class="guide-toggle" onclick="toggleGuide('${taskId}')">
        <span>📖 ガイド・ポイント</span>
        <span id="arrow_${taskId}">▼</span>
      </button>
      <div id="guide_${taskId}" class="guide-content">${escapeHtml(task.guide)}</div>
    `;

    taskList.appendChild(taskCard);
  });

  updateProgress();
}

// チェックボックスの変更と保存
function toggleTask(taskId) {
  const cb = document.getElementById(taskId);
  localStorage.setItem(`cb_${taskId}`, cb.checked);
  updateProgress();
}

// テキスト内容の編集と保存
function updateTaskText(taskId, field, value) {
  localStorage.setItem(`${field}_${taskId}`, value);
}

// ガイドの折りたたみ切り替え
function toggleGuide(taskId) {
  const guide = document.getElementById(`guide_${taskId}`);
  const arrow = document.getElementById(`arrow_${taskId}`);
  if (guide.classList.contains('open')) {
    guide.classList.remove('open');
    arrow.textContent = '▼';
  } else {
    guide.classList.add('open');
    arrow.textContent = '▲';
  }
}

// 進捗度（%）の計算
function updateProgress() {
  let totalTasks = 14 * 3;
  let completedTasks = 0;

  for (let w = 1; w <= 14; w++) {
    for (let t = 0; t < 3; t++) {
      if (localStorage.getItem(`cb_w${w}_t${t}`) === 'true') {
        completedTasks++;
      }
    }
  }

  const percent = Math.round((completedTasks / totalTasks) * 100);
  document.getElementById('progressBadge').textContent = `進捗: ${percent}%`;
}

// エスケープ処理
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
